<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>iPod Classic · Spotify sign-in</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14181d;
      --line: #2a3038;
      --text: #f5f7fa;
      --muted: #9aa4b2;
      --accent: #1ed760;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(800px 500px at 50% -10%, #1b2a22 0%, transparent 70%),
        var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    .mark {
      width: 46px; height: 46px;
      display: grid; place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #f8fafc, #b9c0c9);
      color: #111;
      font-size: 24px;
      margin-bottom: 18px;
    }
    h1 { font-size: 22px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.02em; }
    p { margin: 0; color: var(--muted); }
    .status {
      display: flex; align-items: center; gap: 10px;
      margin: 22px 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0e1115;
      color: var(--text);
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(30,215,96,.12);
      flex: 0 0 auto;
    }
    a.button {
      display: flex; justify-content: center; align-items: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #07120a;
      text-decoration: none;
      font-weight: 700;
      transition: transform .15s ease, filter .15s ease;
    }
    a.button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    small { display: block; margin-top: 16px; color: #717b88; font-size: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♫</div>
    <h1 id="title">Sign-in complete</h1>
    <p id="message">Sending you back to iPod Classic…</p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="status">Opening iPod Classic</span>
    </div>
    <a class="button" id="open" href="ipodclassic://callback">Open iPod Classic</a>
    <small>If the app does not open, tap the button above. You can close this tab afterwards.</small>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const target = "ipodclassic://callback" + (window.location.search || "");
      const open = document.getElementById("open");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const status = document.getElementById("status");

      open.href = target;

      if (params.has("error")) {
        const reason = params.get("error_description") || params.get("error") || "Unknown error";
        title.textContent = "Spotify sign-in failed";
        message.textContent = reason;
        status.textContent = "Return to iPod Classic to try again";
        document.querySelector(".dot").style.background = "#ff5d5d";
        document.querySelector(".dot").style.boxShadow = "0 0 0 4px rgba(255,93,93,.12)";
      } else if (!params.has("code")) {
        title.textContent = "Nothing to send back";
        message.textContent = "Open Spotify sign-in from iPod Classic and try again.";
        status.textContent = "No authorization code found";
      }

      // ASWebAuthenticationSession intercepts this custom-scheme navigation and
      // returns control to the app. Safari shows an "Open" prompt instead.
      setTimeout(function () {
        window.location.replace(target);
      }, 450);
    })();
  </script>
</body>
</html>
